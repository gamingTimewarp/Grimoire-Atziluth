# Grimoire Atziluth — Release workflow
#
# Triggered by pushing a version tag (e.g. v1.0.0 or v1.0.0-rc).
# Produces:
#   • Linux   — .deb, .AppImage, .rpm (via tauri-action)
#   • Windows — .exe installer + .msi  (via tauri-action)
#   • Android — universal .apk         (manual Gradle build)
#
# Android release signing (optional — unsigned debug APK built otherwise):
#   Add these repository secrets to enable signed release APKs:
#     ANDROID_KEYSTORE          — base64-encoded .jks / .keystore file
#     ANDROID_KEYSTORE_PASSWORD — store password
#     ANDROID_KEY_ALIAS         — key alias inside the keystore
#     ANDROID_KEY_PASSWORD      — key password

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Desktop: Linux + Windows ────────────────────────────────────────────────
  build-desktop:
    name: Desktop — ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: grimoire-app/src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build grimoire-core
        run: npm run build
        working-directory: grimoire-core

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prevent tauri-action from waiting for a dev server on Windows
          TAURI_CLI_NO_DEV_SERVER_WAIT: 1
          # Inject version from the git tag so the app displays it at runtime
          VITE_APP_VERSION: ${{ github.ref_name }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Grimoire Atziluth ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          projectPath: ./grimoire-app
          tauriScript: npm run tauri

  # ── Android ─────────────────────────────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,armv7-linux-androideabi,
            i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: grimoire-app/src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build grimoire-core
        run: npm run build
        working-directory: grimoire-core

      - name: Initialise Android project
        working-directory: grimoire-app
        run: npm run tauri android init

      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: grimoire-app/src-tauri/gen/android
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            # Use the provided release keystore
            echo "$ANDROID_KEYSTORE" | base64 --decode > keystore.jks
            cat > key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../keystore.jks
          EOF
          else
            # No release keystore supplied — generate a one-time CI keystore so
            # Gradle can sign the release APK. An unsigned APK is rejected by
            # Android as "invalid"; a debug build APK path differs from release.
            keytool -genkey -v -keystore keystore.jks \
              -storepass android -alias grimoire -keypass android \
              -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=Grimoire Atziluth CI,O=Grimoire,C=US" \
              -noprompt
            cat > key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=grimoire
          storeFile=../keystore.jks
          EOF
          fi

      - name: Build Android APK + AAB
        working-directory: grimoire-app
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: npm run tauri android build -- --apk --aab

      - name: List Android build outputs
        run: find grimoire-app/src-tauri/gen/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) | sort

      - name: Rename artifacts
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          APK=$(find grimoire-app/src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | head -1)
          AAB=$(find grimoire-app/src-tauri/gen/android/app/build/outputs/bundle -type f -name "*.aab" | head -1)
          [ -n "$APK" ] && mv "$APK" "$(dirname "$APK")/Grimoire.Atziluth_${VERSION}_Universal.apk"
          [ -n "$AAB" ] && mv "$AAB" "$(dirname "$AAB")/Grimoire.Atziluth_${VERSION}.aab"

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          name: Grimoire Atziluth ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            grimoire-app/src-tauri/gen/android/app/build/outputs/apk/**/Grimoire.Atziluth_*.apk
            grimoire-app/src-tauri/gen/android/app/build/outputs/bundle/**/Grimoire.Atziluth_*.aab
