<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090900"/>
      <stop offset="100%" stop-color="#161600"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" rx="10" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="5" y="5" width="290" height="410" rx="8"
        fill="none" stroke="#776600" stroke-width="1.5"/>
  <!-- Inner decorative border -->
  <rect x="11" y="11" width="278" height="398" rx="5"
        fill="none" stroke="#999900" stroke-width="0.5" opacity="0.4"/>

  <!-- Separator lines -->
  <line x1="18" y1="76" x2="282" y2="76" stroke="#776600" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="352" x2="282" y2="352" stroke="#776600" stroke-width="0.8" opacity="0.6"/>


  <!-- Pip header: number + decanate -->
  <text x="24" y="45"
        text-anchor="start" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="26" font-weight="300" fill="#ffee88">III</text>
  <!-- Planet symbol -->
  <text x="150" y="38"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="20" fill="#ccbb00" opacity="0.9">♄</text>
  <!-- Sign symbol -->
  <text x="150" y="60"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="18" fill="#999900" opacity="0.75">♎</text>
  <!-- Decan description (tiny) -->
  <text x="276" y="45"
        text-anchor="end" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,serif"
        font-size="8.5" fill="#776633" letter-spacing="0.5">Saturn in Libra</text>

  <!-- Pip arrangement: 3 pips -->
  <g filter="url(#glow)"><g>
  <polygon points="150,66.24 153.87,98.92 150,102.36 146.13,98.92"
           fill="#ccbb00"/>
  <rect x="147.83" y="101.5" width="4.33" height="27.52"
        fill="#ccbb00" opacity="0.85"/>
  <rect x="130.01" y="98.06" width="39.99" height="6.02"
        rx="2.58" fill="#ccbb00"/>
  <rect x="146.9" y="127.3" width="6.19" height="11.18"
        rx="5.16" fill="#ccbb00" opacity="0.6"/>
</g>
  <g>
  <polygon points="68,279.44 71.87,312.12 68,315.56 64.13,312.12"
           fill="#ccbb00"/>
  <rect x="65.83" y="314.7" width="4.33" height="27.52"
        fill="#ccbb00" opacity="0.85"/>
  <rect x="48.01" y="311.26" width="39.99" height="6.02"
        rx="2.58" fill="#ccbb00"/>
  <rect x="64.9" y="340.5" width="6.19" height="11.18"
        rx="5.16" fill="#ccbb00" opacity="0.6"/>
</g>
  <g>
  <polygon points="232,279.44 235.87,312.12 232,315.56 228.13,312.12"
           fill="#ccbb00"/>
  <rect x="229.83" y="314.7" width="4.33" height="27.52"
        fill="#ccbb00" opacity="0.85"/>
  <rect x="212.01" y="311.26" width="39.99" height="6.02"
        rx="2.58" fill="#ccbb00"/>
  <rect x="228.9" y="340.5" width="6.19" height="11.18"
        rx="5.16" fill="#ccbb00" opacity="0.6"/>
</g></g>

  <!-- Footer: card title -->
  <text x="150" y="374"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="16" fill="#ffee88" letter-spacing="2"
        filter="url(#glow)">Sorrow</text>
  <text x="150" y="396"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="9" fill="#776633" letter-spacing="3"
        opacity="0.8">III of Swords</text>
</svg>