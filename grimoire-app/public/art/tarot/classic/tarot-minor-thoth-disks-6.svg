<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020600"/>
      <stop offset="100%" stop-color="#081208"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" rx="10" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="5" y="5" width="290" height="410" rx="8"
        fill="none" stroke="#245518" stroke-width="1.5"/>
  <!-- Inner decorative border -->
  <rect x="11" y="11" width="278" height="398" rx="5"
        fill="none" stroke="#336622" stroke-width="0.5" opacity="0.4"/>

  <!-- Separator lines -->
  <line x1="18" y1="76" x2="282" y2="76" stroke="#245518" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="352" x2="282" y2="352" stroke="#245518" stroke-width="0.8" opacity="0.6"/>


  <!-- Pip header: number + decanate -->
  <text x="24" y="45"
        text-anchor="start" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="26" font-weight="300" fill="#99cc77">VI</text>
  <!-- Planet symbol -->
  <text x="150" y="38"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="20" fill="#448833" opacity="0.9">☽</text>
  <!-- Sign symbol -->
  <text x="150" y="60"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="18" fill="#336622" opacity="0.75">♉</text>
  <!-- Decan description (tiny) -->
  <text x="276" y="45"
        text-anchor="end" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,serif"
        font-size="8.5" fill="#336622" letter-spacing="0.5">Moon in Taurus</text>

  <!-- Pip arrangement: 6 pips -->
  <g filter="url(#glow)"><g>
  <circle cx="68" cy="105.8" r="28.38" fill="none" stroke="#448833" stroke-width="2.97"/>
  <polygon points="68,82.53 81.68,124.63 45.87,98.61 90.13,98.61 54.32,124.63" fill="none" stroke="#448833" stroke-width="2.97" stroke-linejoin="round"/>
</g>
  <g>
  <circle cx="232" cy="105.8" r="28.38" fill="none" stroke="#448833" stroke-width="2.97"/>
  <polygon points="232,82.53 245.68,124.63 209.87,98.61 254.13,98.61 218.32,124.63" fill="none" stroke="#448833" stroke-width="2.97" stroke-linejoin="round"/>
</g>
  <g>
  <circle cx="68" cy="215" r="28.38" fill="none" stroke="#448833" stroke-width="2.97"/>
  <polygon points="68,191.73 81.68,233.83 45.87,207.81 90.13,207.81 54.32,233.83" fill="none" stroke="#448833" stroke-width="2.97" stroke-linejoin="round"/>
</g>
  <g>
  <circle cx="232" cy="215" r="28.38" fill="none" stroke="#448833" stroke-width="2.97"/>
  <polygon points="232,191.73 245.68,233.83 209.87,207.81 254.13,207.81 218.32,233.83" fill="none" stroke="#448833" stroke-width="2.97" stroke-linejoin="round"/>
</g>
  <g>
  <circle cx="68" cy="324.2" r="28.38" fill="none" stroke="#448833" stroke-width="2.97"/>
  <polygon points="68,300.93 81.68,343.03 45.87,317.01 90.13,317.01 54.32,343.03" fill="none" stroke="#448833" stroke-width="2.97" stroke-linejoin="round"/>
</g>
  <g>
  <circle cx="232" cy="324.2" r="28.38" fill="none" stroke="#448833" stroke-width="2.97"/>
  <polygon points="232,300.93 245.68,343.03 209.87,317.01 254.13,317.01 218.32,343.03" fill="none" stroke="#448833" stroke-width="2.97" stroke-linejoin="round"/>
</g></g>

  <!-- Footer: card title -->
  <text x="150" y="374"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="16" fill="#99cc77" letter-spacing="2"
        filter="url(#glow)">Success</text>
  <text x="150" y="396"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="9" fill="#336622" letter-spacing="3"
        opacity="0.8">VI of Disks</text>
</svg>