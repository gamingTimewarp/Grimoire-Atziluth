<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000410"/>
      <stop offset="100%" stop-color="#000f28"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" rx="10" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="5" y="5" width="290" height="410" rx="8"
        fill="none" stroke="#003377" stroke-width="1.5"/>
  <!-- Inner decorative border -->
  <rect x="11" y="11" width="278" height="398" rx="5"
        fill="none" stroke="#0044aa" stroke-width="0.5" opacity="0.4"/>

  <!-- Separator lines -->
  <line x1="18" y1="76" x2="282" y2="76" stroke="#003377" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="352" x2="282" y2="352" stroke="#003377" stroke-width="0.8" opacity="0.6"/>


  <!-- Pip header: number + decanate -->
  <text x="24" y="45"
        text-anchor="start" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="26" font-weight="300" fill="#77bbff">IV</text>
  <!-- Planet symbol -->
  <text x="150" y="38"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="20" fill="#1166dd" opacity="0.9">☽</text>
  <!-- Sign symbol -->
  <text x="150" y="60"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="18" fill="#0044aa" opacity="0.75">♋</text>
  <!-- Decan description (tiny) -->
  <text x="276" y="45"
        text-anchor="end" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,serif"
        font-size="8.5" fill="#224466" letter-spacing="0.5">Moon in Cancer</text>

  <!-- Pip arrangement: 4 pips -->
  <g filter="url(#glow)"><g>
  <path d="M44.79,78.24
           Q42.85,107.1 60.26,118.8
           L64.61,132.84 L71.39,132.84
           Q75.74,118.8 93.15,107.1
           Q91.21,78.24 68,79.8 Z"
        fill="#1166dd"/>
  <rect x="64.61" y="132.06" width="6.77" height="10.92"
        fill="#1166dd"/>
  <rect x="53.49" y="141.42" width="29.02" height="6.24"
        rx="3.12" fill="#1166dd"/>
</g>
  <g>
  <path d="M208.79,78.24
           Q206.85,107.1 224.26,118.8
           L228.61,132.84 L235.39,132.84
           Q239.74,118.8 257.15,107.1
           Q255.21,78.24 232,79.8 Z"
        fill="#1166dd"/>
  <rect x="228.61" y="132.06" width="6.77" height="10.92"
        fill="#1166dd"/>
  <rect x="217.49" y="141.42" width="29.02" height="6.24"
        rx="3.12" fill="#1166dd"/>
</g>
  <g>
  <path d="M44.79,286.24
           Q42.85,315.1 60.26,326.8
           L64.61,340.84 L71.39,340.84
           Q75.74,326.8 93.15,315.1
           Q91.21,286.24 68,287.8 Z"
        fill="#1166dd"/>
  <rect x="64.61" y="340.06" width="6.77" height="10.92"
        fill="#1166dd"/>
  <rect x="53.49" y="349.42" width="29.02" height="6.24"
        rx="3.12" fill="#1166dd"/>
</g>
  <g>
  <path d="M208.79,286.24
           Q206.85,315.1 224.26,326.8
           L228.61,340.84 L235.39,340.84
           Q239.74,326.8 257.15,315.1
           Q255.21,286.24 232,287.8 Z"
        fill="#1166dd"/>
  <rect x="228.61" y="340.06" width="6.77" height="10.92"
        fill="#1166dd"/>
  <rect x="217.49" y="349.42" width="29.02" height="6.24"
        rx="3.12" fill="#1166dd"/>
</g></g>

  <!-- Footer: card title -->
  <text x="150" y="374"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="16" fill="#77bbff" letter-spacing="2"
        filter="url(#glow)">Luxury</text>
  <text x="150" y="396"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="9" fill="#224466" letter-spacing="3"
        opacity="0.8">IV of Cups</text>
</svg>