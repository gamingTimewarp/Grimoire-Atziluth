<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0100"/>
      <stop offset="100%" stop-color="#280500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" rx="10" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="5" y="5" width="290" height="410" rx="8"
        fill="none" stroke="#7a1200" stroke-width="1.5"/>
  <!-- Inner decorative border -->
  <rect x="11" y="11" width="278" height="398" rx="5"
        fill="none" stroke="#bb1e00" stroke-width="0.5" opacity="0.4"/>

  <!-- Separator lines -->
  <line x1="18" y1="76" x2="282" y2="76" stroke="#7a1200" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="352" x2="282" y2="352" stroke="#7a1200" stroke-width="0.8" opacity="0.6"/>


  <!-- Pip header: number + decanate -->
  <text x="24" y="45"
        text-anchor="start" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="26" font-weight="300" fill="#ffcc44">VIII</text>
  <!-- Planet symbol -->
  <text x="150" y="38"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="20" fill="#ee4400" opacity="0.9">☿</text>
  <!-- Sign symbol -->
  <text x="150" y="60"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="18" fill="#bb1e00" opacity="0.75">♐</text>
  <!-- Decan description (tiny) -->
  <text x="276" y="45"
        text-anchor="end" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,serif"
        font-size="8.5" fill="#994422" letter-spacing="0.5">Mercury in Sagittarius</text>

  <!-- Pip arrangement: 8 pips -->
  <g filter="url(#glow)"><g>
  <line x1="68" y1="122.64" x2="68" y2="82.32"
        stroke="#ee4400" stroke-width="6.16" stroke-linecap="round"/>
  <ellipse cx="68" cy="77.84" rx="6.66" ry="9.52" fill="#ee4400"/>
  <circle cx="68" cy="122.64" r="4.48" fill="#ee4400"/>
</g>
  <g>
  <line x1="232" y1="122.64" x2="232" y2="82.32"
        stroke="#ee4400" stroke-width="6.16" stroke-linecap="round"/>
  <ellipse cx="232" cy="77.84" rx="6.66" ry="9.52" fill="#ee4400"/>
  <circle cx="232" cy="122.64" r="4.48" fill="#ee4400"/>
</g>
  <g>
  <line x1="68" y1="182.44" x2="68" y2="142.12"
        stroke="#ee4400" stroke-width="6.16" stroke-linecap="round"/>
  <ellipse cx="68" cy="137.64" rx="6.66" ry="9.52" fill="#ee4400"/>
  <circle cx="68" cy="182.44" r="4.48" fill="#ee4400"/>
</g>
  <g>
  <line x1="232" y1="182.44" x2="232" y2="142.12"
        stroke="#ee4400" stroke-width="6.16" stroke-linecap="round"/>
  <ellipse cx="232" cy="137.64" rx="6.66" ry="9.52" fill="#ee4400"/>
  <circle cx="232" cy="182.44" r="4.48" fill="#ee4400"/>
</g>
  <g>
  <line x1="68" y1="296.84" x2="68" y2="256.52"
        stroke="#ee4400" stroke-width="6.16" stroke-linecap="round"/>
  <ellipse cx="68" cy="252.04" rx="6.66" ry="9.52" fill="#ee4400"/>
  <circle cx="68" cy="296.84" r="4.48" fill="#ee4400"/>
</g>
  <g>
  <line x1="232" y1="296.84" x2="232" y2="256.52"
        stroke="#ee4400" stroke-width="6.16" stroke-linecap="round"/>
  <ellipse cx="232" cy="252.04" rx="6.66" ry="9.52" fill="#ee4400"/>
  <circle cx="232" cy="296.84" r="4.48" fill="#ee4400"/>
</g>
  <g>
  <line x1="68" y1="356.64" x2="68" y2="316.32"
        stroke="#ee4400" stroke-width="6.16" stroke-linecap="round"/>
  <ellipse cx="68" cy="311.84" rx="6.66" ry="9.52" fill="#ee4400"/>
  <circle cx="68" cy="356.64" r="4.48" fill="#ee4400"/>
</g>
  <g>
  <line x1="232" y1="356.64" x2="232" y2="316.32"
        stroke="#ee4400" stroke-width="6.16" stroke-linecap="round"/>
  <ellipse cx="232" cy="311.84" rx="6.66" ry="9.52" fill="#ee4400"/>
  <circle cx="232" cy="356.64" r="4.48" fill="#ee4400"/>
</g></g>

  <!-- Footer: card title -->
  <text x="150" y="374"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="16" fill="#ffcc44" letter-spacing="2"
        filter="url(#glow)">Swiftness</text>
  <text x="150" y="396"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="9" fill="#994422" letter-spacing="3"
        opacity="0.8">VIII of Wands</text>
</svg>