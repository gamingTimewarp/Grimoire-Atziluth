<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000410"/>
      <stop offset="100%" stop-color="#000f28"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" rx="10" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="5" y="5" width="290" height="410" rx="8"
        fill="none" stroke="#003377" stroke-width="1.5"/>
  <!-- Inner decorative border -->
  <rect x="11" y="11" width="278" height="398" rx="5"
        fill="none" stroke="#0044aa" stroke-width="0.5" opacity="0.4"/>

  <!-- Separator lines -->
  <line x1="18" y1="76" x2="282" y2="76" stroke="#003377" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="352" x2="282" y2="352" stroke="#003377" stroke-width="0.8" opacity="0.6"/>


  <!-- Pip header: number + decanate -->
  <text x="24" y="45"
        text-anchor="start" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="26" font-weight="300" fill="#77bbff">III</text>
  <!-- Planet symbol -->
  <text x="150" y="38"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="20" fill="#1166dd" opacity="0.9">☿</text>
  <!-- Sign symbol -->
  <text x="150" y="60"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="18" fill="#0044aa" opacity="0.75">♋</text>
  <!-- Decan description (tiny) -->
  <text x="276" y="45"
        text-anchor="end" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,serif"
        font-size="8.5" fill="#224466" letter-spacing="0.5">Mercury in Cancer</text>

  <!-- Pip arrangement: 3 pips -->
  <g filter="url(#glow)"><g>
  <path d="M124.41,69.68
           Q122.27,101.5 141.47,114.4
           L146.27,129.88 L153.73,129.88
           Q158.53,114.4 177.73,101.5
           Q175.59,69.68 150,71.4 Z"
        fill="#1166dd"/>
  <rect x="146.27" y="129.02" width="7.46" height="12.04"
        fill="#1166dd"/>
  <rect x="134" y="139.34" width="31.99" height="6.88"
        rx="3.44" fill="#1166dd"/>
</g>
  <g>
  <path d="M42.41,282.88
           Q40.27,314.7 59.47,327.6
           L64.27,343.08 L71.73,343.08
           Q76.53,327.6 95.73,314.7
           Q93.59,282.88 68,284.6 Z"
        fill="#1166dd"/>
  <rect x="64.27" y="342.22" width="7.46" height="12.04"
        fill="#1166dd"/>
  <rect x="52" y="352.54" width="31.99" height="6.88"
        rx="3.44" fill="#1166dd"/>
</g>
  <g>
  <path d="M206.41,282.88
           Q204.27,314.7 223.47,327.6
           L228.27,343.08 L235.73,343.08
           Q240.53,327.6 259.73,314.7
           Q257.59,282.88 232,284.6 Z"
        fill="#1166dd"/>
  <rect x="228.27" y="342.22" width="7.46" height="12.04"
        fill="#1166dd"/>
  <rect x="216" y="352.54" width="31.99" height="6.88"
        rx="3.44" fill="#1166dd"/>
</g></g>

  <!-- Footer: card title -->
  <text x="150" y="374"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="16" fill="#77bbff" letter-spacing="2"
        filter="url(#glow)">Abundance</text>
  <text x="150" y="396"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="9" fill="#224466" letter-spacing="3"
        opacity="0.8">III of Cups</text>
</svg>