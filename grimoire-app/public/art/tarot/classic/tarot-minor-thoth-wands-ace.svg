<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0100"/>
      <stop offset="100%" stop-color="#280500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" rx="10" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="5" y="5" width="290" height="410" rx="8"
        fill="none" stroke="#7a1200" stroke-width="1.5"/>
  <!-- Inner decorative border -->
  <rect x="11" y="11" width="278" height="398" rx="5"
        fill="none" stroke="#bb1e00" stroke-width="0.5" opacity="0.4"/>

  <!-- Separator lines -->
  <line x1="18" y1="76" x2="282" y2="76" stroke="#7a1200" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="352" x2="282" y2="352" stroke="#7a1200" stroke-width="0.8" opacity="0.6"/>


  <!-- ACE header -->
  <text x="150" y="46"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="13" fill="#994422" letter-spacing="4" opacity="0.8">ACE · WANDS</text>

  <!-- Large central pip -->
  <polygon points="150,136.75 92.5,234.5 207.5,234.5" fill="none" stroke="#bb1e00" stroke-width="6.9" opacity="0.8"/>
  <g filter="url(#glow)"><g>
  <line x1="150" y1="268.2" x2="150" y2="156.6"
        stroke="#ee4400" stroke-width="17.05" stroke-linecap="round"/>
  <ellipse cx="150" cy="144.2" rx="18.45" ry="26.35" fill="#ee4400"/>
  <circle cx="150" cy="268.2" r="12.4" fill="#ee4400"/>
</g></g>

  <!-- Footer: card title -->
  <text x="150" y="374"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="16" fill="#ffcc44" letter-spacing="2"
        filter="url(#glow)">Ace of Wands</text>
  <text x="150" y="396"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="9" fill="#994422" letter-spacing="3"
        opacity="0.8">Root of the Powers of Fire</text>
</svg>