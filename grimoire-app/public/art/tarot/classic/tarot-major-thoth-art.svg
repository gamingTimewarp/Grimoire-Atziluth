<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#040818"/>
      <stop offset="100%" stop-color="#060c24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" rx="10" fill="url(#bg)"/>
  <!-- Outer border -->
  <rect x="5" y="5" width="290" height="410" rx="8"
        fill="none" stroke="#1a2a6a" stroke-width="1.5"/>
  <!-- Inner accent border -->
  <rect x="11" y="11" width="278" height="398" rx="5"
        fill="none" stroke="#2a4aaa" stroke-width="0.5" opacity="0.5"/>

  <!-- Header separator -->
  <line x1="18" y1="76" x2="282" y2="76" stroke="#1a2a6a" stroke-width="0.8" opacity="0.5"/>
  <!-- Footer separator -->
  <line x1="18" y1="352" x2="282" y2="352" stroke="#1a2a6a" stroke-width="0.8" opacity="0.5"/>

  <!-- Card number (top-left) -->
  <text x="24" y="48"
        text-anchor="start" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="22" font-weight="300" fill="#88aaee" opacity="0.9">XIV</text>

  <!-- Hebrew letter (top-centre) -->
  <text x="150" y="40"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Times New Roman','FreeSerif',serif"
        font-size="26" fill="#2a4aaa" opacity="0.85" filter="url(#glow)">ס</text>

  <!-- Attribution (top-right, small) -->
  <text x="276" y="48"
        text-anchor="end" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="11" fill="#2a3a6a" opacity="0.8">♐</text>


  <!-- Ghost Samekh (ס) — the Prop that supports the Great Work across the Abyss -->
  <text x="152" y="218"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Times New Roman','FreeSerif',serif"
        font-size="252" fill="#020c28" opacity="0.10">ס</text>

  <!-- Rainbow — covenant, the Archer's bow, the throne-circle; arcs bow upward from y=198 -->
  <!-- Reuse: same solar/lunar gradient colours as the left/right split of The Lovers (VI), -->
  <!--        now unified into a single arc — the duality of VI resolved in XIV             -->
  <path d="M22,198 A128,88 0 0,0 278,198"
        fill="none" stroke="#dd2200" stroke-width="3.8" opacity="0.30"/>
  <path d="M22,198 A128,82 0 0,0 278,198"
        fill="none" stroke="#ee6622" stroke-width="3.5" opacity="0.30"/>
  <path d="M22,198 A128,76 0 0,0 278,198"
        fill="none" stroke="#ddcc00" stroke-width="3.2" opacity="0.30"/>
  <path d="M22,198 A128,70 0 0,0 278,198"
        fill="none" stroke="#228844" stroke-width="3" opacity="0.30"/>
  <path d="M22,198 A128,64 0 0,0 278,198"
        fill="none" stroke="#2255cc" stroke-width="3" opacity="0.30"/>
  <path d="M22,198 A128,58 0 0,0 278,198"
        fill="none" stroke="#4422aa" stroke-width="2.8" opacity="0.30"/>
  <path d="M22,198 A128,52 0 0,0 278,198"
        fill="none" stroke="#8822cc" stroke-width="2.5" opacity="0.30"/>

  <!-- Large caduceus — reused from the altar of The Lovers (VI), now the structural axis -->
  <!-- The altar of the Alchemical Marriage becomes the spine of the Great Work -->
  <!-- Staff -->
  <line x1="150" y1="178" x2="150" y2="298"
        stroke="#ddaa22" stroke-width="1.8" opacity="0.44"/>
  <!-- Sulphur serpent (left coil, fire-orange) — volatile principle -->
  <path d="M141,178 C165,184.72 165,195.28 141,202 C135,208.72 135,219.28 159,226 C165,232.72 165,243.28 141,250 C135,256.72 135,267.28 159,274 C165,280.72 165,291.28 141,298"
        fill="none" stroke="#ff6622" stroke-width="1.5" opacity="0.62"/>
  <!-- Mercury serpent (right coil, water-blue) — fixed principle -->
  <path d="M159,178 C135,184.72 135,195.28 159,202 C165,208.72 165,219.28 141,226 C135,232.72 135,243.28 159,250 C165,256.72 165,267.28 141,274 C135,280.72 135,291.28 159,298"
        fill="none" stroke="#3366aa" stroke-width="1.5" opacity="0.62"/>
  <!-- Caduceus wing-pair at top — the winged staff signal -->
  <path d="M141,182 C124,174 120,186 128,196"
        fill="none" stroke="#ddaa22" stroke-width="1.3" opacity="0.52"/>
  <path d="M159,182 C176,174 180,186 172,196"
        fill="none" stroke="#ddaa22" stroke-width="1.3" opacity="0.52"/>

  <!-- Crossed streams — the X of solve et coagula; fire into water, water into fire -->
  <!-- Both streams arc PAST the centre line before converging in the cauldron -->
  <!-- Gold cup → water stream (blue): pours rightward, crosses left, enters cauldron -->
  <path d="M108,194 C130,238 232,260 150,298"
        fill="none" stroke="#3366aa" stroke-width="2.6" opacity="0.54" stroke-linecap="round"/>
  <!-- Silver cup → fire stream (orange): pours leftward, crosses right, enters cauldron -->
  <path d="M192,194 C170,238 244,260 150,298"
        fill="none" stroke="#ff6622" stroke-width="2.6" opacity="0.54" stroke-linecap="round"/>
  <!-- Quintessence glow at the crossing point — the new substance, neither fire nor water -->
  <circle cx="150" cy="238" r="8" fill="#ffffbb" opacity="0.10" filter="url(#softglow)"/>
  <circle cx="150" cy="238" r="3" fill="#ffffdd" opacity="0.28"/>

  <!-- Art figure — the Rebis of The Lovers (VI) grown to full active height -->
  <!-- Robe split at centre seam: left panel solar gold, right panel lunar silver -->
  <!-- Reuse: rebisGrad split concept from card VI, now as a full-length robe -->
  <!-- Left robe panel (solar, gold) -->
  <path d="M147,180 Q120,224 114,296
           L150,296 Z"
        fill="#cc8800" opacity="0.78"/>
  <!-- Right robe panel (lunar, silver-blue) -->
  <path d="M153,180 Q180,224 186,296
           L150,296 Z"
        fill="#5566aa" opacity="0.70"/>
  <!-- Centre seam — same Zain/dashed axis as in The Lovers (VI) -->
  <line x1="150" y1="170" x2="150" y2="296"
        stroke="#ffffff" stroke-width="0.6" stroke-dasharray="3 5" opacity="0.20"/>
  <!-- Neck -->
  <rect x="144" y="162" width="12" height="10" rx="2"
        fill="#aa8855" opacity="0.70"/>

  <!-- White eagle (left/solar robe) — volatile principle fixed by Art's operation -->
  <!-- Volatile→Fixed: reversed position from The Lovers (VI) -->
  <!-- Wing curves derived from card IV heraldic phoenix -->
  <path d="M128,230 C110,216 100,226 110,246"
        fill="#ddeeff" opacity="0.56"/>
  <path d="M128,230 C140,220 146,228 140,242"
        fill="#ddeeff" opacity="0.50"/>
  <!-- Eagle head + beak -->
  <circle cx="128" cy="221" r="5" fill="#ddeeff" opacity="0.66"/>
  <path d="M126,224 L120,227"
        stroke="#ddeeff" stroke-width="1.4" stroke-linecap="round" opacity="0.62"/>
  <!-- Tail feathers -->
  <path d="M126,244 L122,252 M130,244 L130,253"
        fill="none" stroke="#ddeeff" stroke-width="1.0" opacity="0.44"/>

  <!-- Red lion (right/lunar robe) — fixed principle volatilised by Art's operation -->
  <!-- Fixed→Volatile: reversed position from The Lovers (VI) -->
  <!-- Leonine form consistent with Lust (XI) -->
  <ellipse cx="172" cy="241" rx="10" ry="8" fill="#cc3322" opacity="0.58"/>
  <circle  cx="172" cy="230" r="9" fill="#cc3322" opacity="0.62"/>
  <line x1="172" y1="221" x2="172" y2="216" stroke="#cc3322" stroke-width="1.5" opacity="0.46"/>
  <line x1="178.36" y1="223.64" x2="181.9" y2="220.1" stroke="#cc3322" stroke-width="1.5" opacity="0.46"/>
  <line x1="181" y1="230" x2="186" y2="230" stroke="#cc3322" stroke-width="1.5" opacity="0.46"/>
  <line x1="178.36" y1="236.36" x2="181.9" y2="239.9" stroke="#cc3322" stroke-width="1.5" opacity="0.46"/>
  <line x1="172" y1="239" x2="172" y2="244" stroke="#cc3322" stroke-width="1.5" opacity="0.46"/>
  <line x1="165.64" y1="236.36" x2="162.1" y2="239.9" stroke="#cc3322" stroke-width="1.5" opacity="0.46"/>
  <line x1="163" y1="230" x2="158" y2="230" stroke="#cc3322" stroke-width="1.5" opacity="0.46"/>
  <line x1="165.64" y1="223.64" x2="162.1" y2="220.1" stroke="#cc3322" stroke-width="1.5" opacity="0.46"/>
  <circle cx="169" cy="228" r="1.5" fill="#ffaa00" opacity="0.80"/>
  <circle cx="175" cy="228" r="1.5" fill="#ffaa00" opacity="0.80"/>
  <path d="M180,240 Q190,246 194,238"
        fill="none" stroke="#cc3322" stroke-width="1.2" opacity="0.44" stroke-linecap="round"/>

  <!-- Cauldron — the Marriage altar of The Lovers (VI) transformed into the vessel of the Work -->
  <!-- Reuse: same plinth rect dimensions and stone palette (#1c0e00/#241200) scaled to 2× -->
  <!-- Rim — derived from altar top slab in VI (x=119 y=aY-4 width=62 h=6), scaled 2× -->
  <rect x="104" y="298" width="92" height="7" rx="2"
        fill="#2a1a08" stroke="#443322" stroke-width="1" opacity="0.90"/>
  <!-- Body — derived from altar face in VI (x=123 y=aY width=54 h=18), scaled 2× -->
  <rect x="109" y="305" width="82" height="21" rx="2"
        fill="#1a1010" stroke="#332211" stroke-width="1" opacity="0.92"/>
  <!-- V.I.T.R.I.O.L. on the rim — "Visita Interiora Terrae Rectificando Invenies Occultum Lapidem" -->
  <text x="150" y="301.8"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Courier New',monospace" letter-spacing="1.5"
        font-size="5.5" fill="#aa8833" opacity="0.74">V·I·T·R·I·O·L</text>
  <!-- Cauldron fire — rising from the mixed quintessence within -->
  <path d="M136,298 Q141,282 148,272 Q150,268 152,272 Q159,282 164,298"
        fill="#ff6622" opacity="0.52" filter="url(#glow)"/>
  <path d="M141,298 Q146,286 150,280 Q154,286 159,298"
        fill="#ffaa00" opacity="0.58"/>
  <!-- Rain drops falling into cauldron — fire and water coexist within -->
  <circle cx="129" cy="278" r="1.5" fill="#3366aa" opacity="0.54"/>
  <circle cx="141" cy="268" r="1.5" fill="#3366aa" opacity="0.47"/>
  <circle cx="159" cy="271" r="1.5" fill="#3366aa" opacity="0.50"/>
  <circle cx="170" cy="279" r="1.5" fill="#3366aa" opacity="0.44"/>
  <!-- Cauldron tripod legs — the threefold support of the Great Work -->
  <line x1="115" y1="326" x2="107" y2="330"
        stroke="#332211" stroke-width="2.2" stroke-linecap="round" opacity="0.84"/>
  <line x1="150" y1="326" x2="150" y2="330"
        stroke="#332211" stroke-width="2.2" stroke-linecap="round" opacity="0.84"/>
  <line x1="185" y1="326" x2="193" y2="330"
        stroke="#332211" stroke-width="2.2" stroke-linecap="round" opacity="0.84"/>

  <!-- Arms — same construction as King and Queen arm lines in The Lovers (VI) -->
  <!-- Left arm (solar, gold) — holds gold cup: same stroke as King's arm in VI -->
  <line x1="136" y1="184" x2="108" y2="184"
        stroke="#ddaa22" stroke-width="7" stroke-linecap="round" opacity="0.74"/>
  <!-- Right arm (lunar, silver) — holds silver cup: same stroke as Queen's arm in VI -->
  <line x1="164" y1="184" x2="192" y2="184"
        stroke="#8899bb" stroke-width="7" stroke-linecap="round" opacity="0.70"/>
  <!-- Gold cup (solar — pours water; the same Grail lineage: Chariot VII → Lust XI → Art XIV) -->
  <g opacity="0.88">
  <path d="M103.83,178.12
           Q103.49,183.3 106.61,185.4
           L107.39,187.92 L108.61,187.92
           Q109.39,185.4 112.51,183.3
           Q112.17,178.12 108,178.4 Z"
        fill="#ddaa22"/>
  <rect x="107.39" y="187.78" width="1.22" height="1.96"
        fill="#ddaa22"/>
  <rect x="105.4" y="189.46" width="5.21" height="1.12"
        rx="0.56" fill="#ddaa22"/>
</g>
  <!-- Silver cup (lunar — pours fire; the Quintessence vessel) -->
  <g opacity="0.82">
  <path d="M187.83,178.12
           Q187.49,183.3 190.61,185.4
           L191.39,187.92 L192.61,187.92
           Q193.39,185.4 196.51,183.3
           Q196.17,178.12 192,178.4 Z"
        fill="#8899bb"/>
  <rect x="191.39" y="187.78" width="1.22" height="1.96"
        fill="#8899bb"/>
  <rect x="189.4" y="189.46" width="5.21" height="1.12"
        rx="0.56" fill="#8899bb"/>
</g>

  <!-- Dual face — solar left + lunar right; same face constructions as King and Queen in VI -->
  <!-- One figure, two natures — the Rebis made active -->
  <!-- Left half (solar gold, #c8a060) — reused from King's circle in card VI -->
  <path d="M150,134 A14,14 0 0,0 150,162 Z"
        fill="#c8a060" opacity="0.90"/>
  <!-- Right half (lunar silver, #c0b8d0) — reused from Queen's circle in card VI -->
  <path d="M150,134 A14,14 0 0,1 150,162 Z"
        fill="#c0b8d0" opacity="0.90"/>
  <!-- Facial dividing line (same dashed axis as Zain in card VI) -->
  <line x1="150" y1="134" x2="150" y2="162"
        stroke="#ccccee" stroke-width="0.5" opacity="0.38"/>

  <!-- Dual crown — solarDisk + crescent — reused from Rebis crown in The Lovers (VI) -->
  <!-- Crown band joining both halves -->
  <rect x="130" y="131" width="40" height="6" rx="2"
        fill="#aa8844" opacity="0.84"/>
  <!-- Solar crown left — fourth use of the solarDisk palette in the descent arc -->
  <!-- (Fool=free sky; Hermit=lantern; Babalon=nimbus; Hanged Man=inverted halo; Art=crown) -->
  <g>
  <circle cx="137" cy="126" r="23.87" fill="#fffde0" opacity="0.18" filter="url(#softglow)"/>
  <circle cx="137" cy="126" r="16.5" fill="#fffbe8" opacity="0.45" filter="url(#softglow)"/>
  <circle cx="137" cy="126" r="11" fill="#fff5b0" opacity="0.88"/>
  <line x1="152" y1="126"
               x2="160.87"       y2="126"
               stroke="#ffee66" stroke-width="1.5" opacity="0.65"/>
  <line x1="150.86" y1="131.74"
               x2="154.78"       y2="133.37"
               stroke="#ffee66" stroke-width="0.8" opacity="0.65"/>
  <line x1="147.61" y1="136.61"
               x2="153.88"       y2="142.88"
               stroke="#ffee66" stroke-width="1.5" opacity="0.65"/>
  <line x1="142.74" y1="139.86"
               x2="144.37"       y2="143.78"
               stroke="#ffee66" stroke-width="0.8" opacity="0.65"/>
  <line x1="137" y1="141"
               x2="137"       y2="149.87"
               stroke="#ffee66" stroke-width="1.5" opacity="0.65"/>
  <line x1="131.26" y1="139.86"
               x2="129.63"       y2="143.78"
               stroke="#ffee66" stroke-width="0.8" opacity="0.65"/>
  <line x1="126.39" y1="136.61"
               x2="120.12"       y2="142.88"
               stroke="#ffee66" stroke-width="1.5" opacity="0.65"/>
  <line x1="123.14" y1="131.74"
               x2="119.22"       y2="133.37"
               stroke="#ffee66" stroke-width="0.8" opacity="0.65"/>
  <line x1="122" y1="126"
               x2="113.13"       y2="126"
               stroke="#ffee66" stroke-width="1.5" opacity="0.65"/>
  <line x1="123.14" y1="120.26"
               x2="119.22"       y2="118.63"
               stroke="#ffee66" stroke-width="0.8" opacity="0.65"/>
  <line x1="126.39" y1="115.39"
               x2="120.12"       y2="109.12"
               stroke="#ffee66" stroke-width="1.5" opacity="0.65"/>
  <line x1="131.26" y1="112.14"
               x2="129.63"       y2="108.22"
               stroke="#ffee66" stroke-width="0.8" opacity="0.65"/>
  <line x1="137" y1="111"
               x2="137"       y2="102.13"
               stroke="#ffee66" stroke-width="1.5" opacity="0.65"/>
  <line x1="142.74" y1="112.14"
               x2="144.37"       y2="108.22"
               stroke="#ffee66" stroke-width="0.8" opacity="0.65"/>
  <line x1="147.61" y1="115.39"
               x2="153.88"       y2="109.12"
               stroke="#ffee66" stroke-width="1.5" opacity="0.65"/>
  <line x1="150.86" y1="120.26"
               x2="154.78"       y2="118.63"
               stroke="#ffee66" stroke-width="0.8" opacity="0.65"/>
</g>
  <!-- Lunar crescent right — circle-cutout construction from card VI rebis crown -->
  <circle cx="161" cy="126" r="10"   fill="#8899bb" opacity="0.85"/>
  <circle cx="165" cy="126" r="8.5"  fill="#040818"   opacity="0.94"/>

  <!-- Sagittarius bow — C-curve form reused from Eros (VI); now the cosmic Archer's bow -->
  <!-- Left limb: same cubic bezier as Eros, now large and left-symmetric -->
  <path d="M60,86 C24,97 24,112 60,122"
        fill="none" stroke="#aa7722" stroke-width="3.5" stroke-linecap="round" opacity="0.74"/>
  <!-- Right limb (mirror) -->
  <path d="M240,86 C276,97 276,112 240,122"
        fill="none" stroke="#aa7722" stroke-width="3.5" stroke-linecap="round" opacity="0.74"/>
  <!-- Bowstring: from left tip, drawn back to nock, to right tip -->
  <path d="M60,86 L150,106 L240,86"
        fill="none" stroke="#ddcc44" stroke-width="1.3" opacity="0.62"/>
  <path d="M60,122 L150,106 L240,122"
        fill="none" stroke="#ddcc44" stroke-width="1.3" opacity="0.62"/>
  <!-- Nock point -->
  <circle cx="150" cy="106" r="2.8" fill="#ddcc44" opacity="0.80"/>

  <!-- Arrow spine — the Zain axis of The Lovers (VI) made material and directed -->
  <!-- The path descends Tiphareth→Yesod, but the Archer's will aspires upward -->
  <!-- Shaft glow -->
  <line x1="150" y1="84" x2="150" y2="298"
        stroke="#ddcc44" stroke-width="5" opacity="0.07" filter="url(#softglow)"/>
  <!-- Shaft -->
  <line x1="150" y1="84" x2="150" y2="298"
        stroke="#ddcc44" stroke-width="1.2" opacity="0.58"/>
  <!-- Arrowhead (pointing up — toward Tiphareth) -->
  <polygon points="150,83 144.5,97 155.5,97"
           fill="#ddcc44" opacity="0.72"/>
  <!-- Fletch (at nock, below the bowstring) -->
  <line x1="147" y1="112" x2="142" y2="122"
        stroke="#ddcc44" stroke-width="1.1" opacity="0.54"/>
  <line x1="153" y1="112" x2="158" y2="122"
        stroke="#ddcc44" stroke-width="1.1" opacity="0.54"/>

  <!-- Floor — Gemini ♊ (card VI) resolved into Sagittarius ♐ (card XIV) -->
  <!-- Same positions, same sizing — opposite signs: duality unified into direction -->
  <path d="M18,330 Q80,326 150,332 Q220,326 282,330 L282,352 L18,352 Z"
        fill="#040818" opacity="0.72"/>
  <text x="68"  y="344" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols',sans-serif"
        font-size="15" fill="#ddaa22" opacity="0.38">♐</text>
  <text x="232" y="344" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols',sans-serif"
        font-size="15" fill="#8899bb" opacity="0.38">♐</text>

  <!-- Card title -->
  <text x="150" y="374"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="17" fill="#88aaee" letter-spacing="2.5"
        filter="url(#glow)">ART</text>

  <!-- Hebrew name / path -->
  <text x="150" y="396"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="9" fill="#2a3a6a" letter-spacing="3" opacity="0.75">Samekh · Sagittarius · Path 25</text>
</svg>