<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000410"/>
      <stop offset="100%" stop-color="#000f28"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" rx="10" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="5" y="5" width="290" height="410" rx="8"
        fill="none" stroke="#003377" stroke-width="1.5"/>
  <!-- Inner decorative border -->
  <rect x="11" y="11" width="278" height="398" rx="5"
        fill="none" stroke="#0044aa" stroke-width="0.5" opacity="0.4"/>

  <!-- Separator lines -->
  <line x1="18" y1="76" x2="282" y2="76" stroke="#003377" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="352" x2="282" y2="352" stroke="#003377" stroke-width="0.8" opacity="0.6"/>


  <!-- ACE header -->
  <text x="150" y="46"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="13" fill="#224466" letter-spacing="4" opacity="0.8">ACE · CUPS</text>

  <!-- Large central pip -->
  <polygon points="150,263.25 92.5,165.5 207.5,165.5" fill="none" stroke="#0044aa" stroke-width="6.9" opacity="0.8"/>
  <g filter="url(#glow)"><g>
  <path d="M103.87,134.9
           Q100.03,192.25 134.62,215.5
           L143.27,243.4 L156.73,243.4
           Q165.38,215.5 199.97,192.25
           Q196.13,134.9 150,138 Z"
        fill="#1166dd"/>
  <rect x="143.27" y="241.85" width="13.45" height="21.7"
        fill="#1166dd"/>
  <rect x="121.17" y="260.45" width="57.66" height="12.4"
        rx="6.2" fill="#1166dd"/>
</g></g>

  <!-- Footer: card title -->
  <text x="150" y="374"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="16" fill="#77bbff" letter-spacing="2"
        filter="url(#glow)">Ace of Cups</text>
  <text x="150" y="396"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="9" fill="#224466" letter-spacing="3"
        opacity="0.8">Root of the Powers of Water</text>
</svg>