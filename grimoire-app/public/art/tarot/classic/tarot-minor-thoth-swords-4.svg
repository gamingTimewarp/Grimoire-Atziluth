<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090900"/>
      <stop offset="100%" stop-color="#161600"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" rx="10" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="5" y="5" width="290" height="410" rx="8"
        fill="none" stroke="#776600" stroke-width="1.5"/>
  <!-- Inner decorative border -->
  <rect x="11" y="11" width="278" height="398" rx="5"
        fill="none" stroke="#999900" stroke-width="0.5" opacity="0.4"/>

  <!-- Separator lines -->
  <line x1="18" y1="76" x2="282" y2="76" stroke="#776600" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="352" x2="282" y2="352" stroke="#776600" stroke-width="0.8" opacity="0.6"/>


  <!-- Pip header: number + decanate -->
  <text x="24" y="45"
        text-anchor="start" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="26" font-weight="300" fill="#ffee88">IV</text>
  <!-- Planet symbol -->
  <text x="150" y="38"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="20" fill="#ccbb00" opacity="0.9">♃</text>
  <!-- Sign symbol -->
  <text x="150" y="60"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="18" fill="#999900" opacity="0.75">♎</text>
  <!-- Decan description (tiny) -->
  <text x="276" y="45"
        text-anchor="end" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,serif"
        font-size="8.5" fill="#776633" letter-spacing="0.5">Jupiter in Libra</text>

  <!-- Pip arrangement: 4 pips -->
  <g filter="url(#glow)"><g>
  <polygon points="68,75.12 71.51,104.76 68,107.88 64.49,104.76"
           fill="#ccbb00"/>
  <rect x="66.03" y="107.1" width="3.93" height="24.96"
        fill="#ccbb00" opacity="0.85"/>
  <rect x="49.87" y="103.98" width="36.27" height="5.46"
        rx="2.34" fill="#ccbb00"/>
  <rect x="65.19" y="130.5" width="5.62" height="10.14"
        rx="4.68" fill="#ccbb00" opacity="0.6"/>
</g>
  <g>
  <polygon points="232,75.12 235.51,104.76 232,107.88 228.49,104.76"
           fill="#ccbb00"/>
  <rect x="230.03" y="107.1" width="3.93" height="24.96"
        fill="#ccbb00" opacity="0.85"/>
  <rect x="213.87" y="103.98" width="36.27" height="5.46"
        rx="2.34" fill="#ccbb00"/>
  <rect x="229.19" y="130.5" width="5.62" height="10.14"
        rx="4.68" fill="#ccbb00" opacity="0.6"/>
</g>
  <g>
  <polygon points="68,283.12 71.51,312.76 68,315.88 64.49,312.76"
           fill="#ccbb00"/>
  <rect x="66.03" y="315.1" width="3.93" height="24.96"
        fill="#ccbb00" opacity="0.85"/>
  <rect x="49.87" y="311.98" width="36.27" height="5.46"
        rx="2.34" fill="#ccbb00"/>
  <rect x="65.19" y="338.5" width="5.62" height="10.14"
        rx="4.68" fill="#ccbb00" opacity="0.6"/>
</g>
  <g>
  <polygon points="232,283.12 235.51,312.76 232,315.88 228.49,312.76"
           fill="#ccbb00"/>
  <rect x="230.03" y="315.1" width="3.93" height="24.96"
        fill="#ccbb00" opacity="0.85"/>
  <rect x="213.87" y="311.98" width="36.27" height="5.46"
        rx="2.34" fill="#ccbb00"/>
  <rect x="229.19" y="338.5" width="5.62" height="10.14"
        rx="4.68" fill="#ccbb00" opacity="0.6"/>
</g></g>

  <!-- Footer: card title -->
  <text x="150" y="374"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="16" fill="#ffee88" letter-spacing="2"
        filter="url(#glow)">Truce</text>
  <text x="150" y="396"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="9" fill="#776633" letter-spacing="3"
        opacity="0.8">IV of Swords</text>
</svg>