<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090900"/>
      <stop offset="100%" stop-color="#161600"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" rx="10" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="5" y="5" width="290" height="410" rx="8"
        fill="none" stroke="#776600" stroke-width="1.5"/>
  <!-- Inner decorative border -->
  <rect x="11" y="11" width="278" height="398" rx="5"
        fill="none" stroke="#999900" stroke-width="0.5" opacity="0.4"/>

  <!-- Separator lines -->
  <line x1="18" y1="76" x2="282" y2="76" stroke="#776600" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="352" x2="282" y2="352" stroke="#776600" stroke-width="0.8" opacity="0.6"/>


  <!-- Pip header: number + decanate -->
  <text x="24" y="45"
        text-anchor="start" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="26" font-weight="300" fill="#ffee88">V</text>
  <!-- Planet symbol -->
  <text x="150" y="38"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="20" fill="#ccbb00" opacity="0.9">♀</text>
  <!-- Sign symbol -->
  <text x="150" y="60"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="18" fill="#999900" opacity="0.75">♒</text>
  <!-- Decan description (tiny) -->
  <text x="276" y="45"
        text-anchor="end" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,serif"
        font-size="8.5" fill="#776633" letter-spacing="0.5">Venus in Aquarius</text>

  <!-- Pip arrangement: 5 pips -->
  <g filter="url(#glow)"><g>
  <polygon points="68,77.88 71.24,105.24 68,108.12 64.76,105.24"
           fill="#ccbb00"/>
  <rect x="66.19" y="107.4" width="3.63" height="23.04"
        fill="#ccbb00" opacity="0.85"/>
  <rect x="51.26" y="104.52" width="33.48" height="5.04"
        rx="2.16" fill="#ccbb00"/>
  <rect x="65.41" y="129" width="5.18" height="9.36"
        rx="4.32" fill="#ccbb00" opacity="0.6"/>
</g>
  <g>
  <polygon points="232,77.88 235.24,105.24 232,108.12 228.76,105.24"
           fill="#ccbb00"/>
  <rect x="230.19" y="107.4" width="3.63" height="23.04"
        fill="#ccbb00" opacity="0.85"/>
  <rect x="215.26" y="104.52" width="33.48" height="5.04"
        rx="2.16" fill="#ccbb00"/>
  <rect x="229.41" y="129" width="5.18" height="9.36"
        rx="4.32" fill="#ccbb00" opacity="0.6"/>
</g>
  <g>
  <polygon points="150,181.88 153.24,209.24 150,212.12 146.76,209.24"
           fill="#ccbb00"/>
  <rect x="148.19" y="211.4" width="3.63" height="23.04"
        fill="#ccbb00" opacity="0.85"/>
  <rect x="133.26" y="208.52" width="33.48" height="5.04"
        rx="2.16" fill="#ccbb00"/>
  <rect x="147.41" y="233" width="5.18" height="9.36"
        rx="4.32" fill="#ccbb00" opacity="0.6"/>
</g>
  <g>
  <polygon points="68,285.88 71.24,313.24 68,316.12 64.76,313.24"
           fill="#ccbb00"/>
  <rect x="66.19" y="315.4" width="3.63" height="23.04"
        fill="#ccbb00" opacity="0.85"/>
  <rect x="51.26" y="312.52" width="33.48" height="5.04"
        rx="2.16" fill="#ccbb00"/>
  <rect x="65.41" y="337" width="5.18" height="9.36"
        rx="4.32" fill="#ccbb00" opacity="0.6"/>
</g>
  <g>
  <polygon points="232,285.88 235.24,313.24 232,316.12 228.76,313.24"
           fill="#ccbb00"/>
  <rect x="230.19" y="315.4" width="3.63" height="23.04"
        fill="#ccbb00" opacity="0.85"/>
  <rect x="215.26" y="312.52" width="33.48" height="5.04"
        rx="2.16" fill="#ccbb00"/>
  <rect x="229.41" y="337" width="5.18" height="9.36"
        rx="4.32" fill="#ccbb00" opacity="0.6"/>
</g></g>

  <!-- Footer: card title -->
  <text x="150" y="374"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="16" fill="#ffee88" letter-spacing="2"
        filter="url(#glow)">Defeat</text>
  <text x="150" y="396"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="9" fill="#776633" letter-spacing="3"
        opacity="0.8">V of Swords</text>
</svg>