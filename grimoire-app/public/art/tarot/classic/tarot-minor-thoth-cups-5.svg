<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000410"/>
      <stop offset="100%" stop-color="#000f28"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" rx="10" fill="url(#bg)"/>
  <!-- Border -->
  <rect x="5" y="5" width="290" height="410" rx="8"
        fill="none" stroke="#003377" stroke-width="1.5"/>
  <!-- Inner decorative border -->
  <rect x="11" y="11" width="278" height="398" rx="5"
        fill="none" stroke="#0044aa" stroke-width="0.5" opacity="0.4"/>

  <!-- Separator lines -->
  <line x1="18" y1="76" x2="282" y2="76" stroke="#003377" stroke-width="0.8" opacity="0.6"/>
  <line x1="18" y1="352" x2="282" y2="352" stroke="#003377" stroke-width="0.8" opacity="0.6"/>


  <!-- Pip header: number + decanate -->
  <text x="24" y="45"
        text-anchor="start" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="26" font-weight="300" fill="#77bbff">V</text>
  <!-- Planet symbol -->
  <text x="150" y="38"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="20" fill="#1166dd" opacity="0.9">♂</text>
  <!-- Sign symbol -->
  <text x="150" y="60"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="18" fill="#0044aa" opacity="0.75">♏</text>
  <!-- Decan description (tiny) -->
  <text x="276" y="45"
        text-anchor="end" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,serif"
        font-size="8.5" fill="#224466" letter-spacing="0.5">Mars in Scorpio</text>

  <!-- Pip arrangement: 5 pips -->
  <g filter="url(#glow)"><g>
  <path d="M46.57,80.76
           Q44.79,107.4 60.86,118.2
           L64.88,131.16 L71.12,131.16
           Q75.14,118.2 91.21,107.4
           Q89.43,80.76 68,82.2 Z"
        fill="#1166dd"/>
  <rect x="64.88" y="130.44" width="6.25" height="10.08"
        fill="#1166dd"/>
  <rect x="54.61" y="139.08" width="26.78" height="5.76"
        rx="2.88" fill="#1166dd"/>
</g>
  <g>
  <path d="M210.57,80.76
           Q208.79,107.4 224.86,118.2
           L228.88,131.16 L235.12,131.16
           Q239.14,118.2 255.21,107.4
           Q253.43,80.76 232,82.2 Z"
        fill="#1166dd"/>
  <rect x="228.88" y="130.44" width="6.25" height="10.08"
        fill="#1166dd"/>
  <rect x="218.61" y="139.08" width="26.78" height="5.76"
        rx="2.88" fill="#1166dd"/>
</g>
  <g>
  <path d="M128.57,184.76
           Q126.79,211.4 142.86,222.2
