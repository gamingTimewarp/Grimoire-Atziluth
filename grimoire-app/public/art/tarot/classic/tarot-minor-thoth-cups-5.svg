  <rect x="146.88" y="234.44" width="6.25" height="10.08"
        fill="#1166dd"/>
  <rect x="136.61" y="243.08" width="26.78" height="5.76"
        rx="2.88" fill="#1166dd"/>
</g>
  <g>
  <path d="M46.57,288.76
           Q44.79,315.4 60.86,326.2
           L64.88,339.16 L71.12,339.16
           Q75.14,326.2 91.21,315.4
           Q89.43,288.76 68,290.2 Z"
        fill="#1166dd"/>
  <rect x="64.88" y="338.44" width="6.25" height="10.08"
        fill="#1166dd"/>
  <rect x="54.61" y="347.08" width="26.78" height="5.76"
        rx="2.88" fill="#1166dd"/>
</g>
  <g>
  <path d="M210.57,288.76
           Q208.79,315.4 224.86,326.2
           L228.88,339.16 L235.12,339.16
           Q239.14,326.2 255.21,315.4
           Q253.43,288.76 232,290.2 Z"
        fill="#1166dd"/>
  <rect x="228.88" y="338.44" width="6.25" height="10.08"
        fill="#1166dd"/>
  <rect x="218.61" y="347.08" width="26.78" height="5.76"
        rx="2.88" fill="#1166dd"/>
</g></g>

  <!-- Footer: card title -->
  <text x="150" y="374"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="16" fill="#77bbff" letter-spacing="2"
        filter="url(#glow)">Disappointment</text>
  <text x="150" y="396"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="9" fill="#224466" letter-spacing="3"
        opacity="0.8">V of Cups</text>
</svg>