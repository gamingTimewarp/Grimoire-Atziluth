<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#020c0a"/>
      <stop offset="100%" stop-color="#04100c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" rx="10" fill="url(#bg)"/>
  <!-- Outer border -->
  <rect x="5" y="5" width="290" height="410" rx="8"
        fill="none" stroke="#1a5a3a" stroke-width="1.5"/>
  <!-- Inner accent border -->
  <rect x="11" y="11" width="278" height="398" rx="5"
        fill="none" stroke="#2a8a5a" stroke-width="0.5" opacity="0.5"/>

  <!-- Header separator -->
  <line x1="18" y1="76" x2="282" y2="76" stroke="#1a5a3a" stroke-width="0.8" opacity="0.5"/>
  <!-- Footer separator -->
  <line x1="18" y1="352" x2="282" y2="352" stroke="#1a5a3a" stroke-width="0.8" opacity="0.5"/>

  <!-- Card number (top-left) -->
  <text x="24" y="48"
        text-anchor="start" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="22" font-weight="300" fill="#88ddbb" opacity="0.9">XIII</text>

  <!-- Hebrew letter (top-centre) -->
  <text x="150" y="40"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Times New Roman','FreeSerif',serif"
        font-size="26" fill="#2a8a5a" opacity="0.85" filter="url(#glow)">נ</text>

  <!-- Attribution (top-right, small) -->
  <text x="276" y="48"
        text-anchor="end" dominant-baseline="middle"
        font-family="'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif"
        font-size="11" fill="#2a5a3a" opacity="0.8">♏</text>


  <!-- Ghost Nun (נ) — Fish; seed in the deep; path 24 from Geburah to Tiphareth -->
  <text x="152" y="218"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Times New Roman','FreeSerif',serif"
        font-size="252" fill="#041a10" opacity="0.11">נ</text>

  <!-- Geburah corner glows — path 24 leads FROM Severity; the death-that-transforms -->
  <circle cx="28"  cy="82" r="24" fill="#661111" opacity="0.16" filter="url(#softglow)"/>
  <circle cx="272" cy="82" r="24" fill="#661111" opacity="0.16" filter="url(#softglow)"/>

  <!-- Abyss waters — Nun domain; the crossing to Tiphareth begins in the depths -->
  <rect x="18" y="300" width="264" height="52" fill="#0a1a20" opacity="0.70"/>
  <path d="M18,306 Q44,298 70,306 Q96,314 122,306 Q148,298 174,306 Q200,314 226,306 Q252,298 282,306"
        fill="none" stroke="#2a7a5a" stroke-width="0.7" opacity="0.35"/>
  <path d="M18,316 Q44,308 70,316 Q96,324 122,316 Q148,308 174,316 Q200,324 226,316 Q252,308 282,316"
        fill="none" stroke="#2a7a5a" stroke-width="0.7" opacity="0.28"/>
  <path d="M18,326 Q44,318 70,326 Q96,334 122,326 Q148,318 174,326 Q200,334 226,326 Q252,318 282,326"
        fill="none" stroke="#2a7a5a" stroke-width="0.6" opacity="0.22"/>

  <!-- Eagle — Scorpio's second form; transcendence above material death -->
  <path d="M108,98 Q129,84 150,90 Q171,84 192,98"
        fill="none" stroke="#2a7a5a" stroke-width="1.5" opacity="0.28"/>
  <path d="M88,110 Q120,94 150,100 Q180,94 212,110"
        fill="none" stroke="#2a7a5a" stroke-width="1.2" opacity="0.22"/>
  <circle cx="150" cy="88" r="3.5" fill="#2a7a5a" opacity="0.22"/>
  <path d="M143,100 Q150,106 157,100"
        fill="none" stroke="#2a7a5a" stroke-width="1.0" opacity="0.20"/>

  <!-- Six Wings of Azrael — Isaiah 6:2; seraph of the divine presence -->
  <!-- Lower wings (feet-covering, pointing down) drawn first -->
  <path d="M132,210 C86,248 76,308 106,318 C124,292 132,248 134,210 Z" fill="#0d3828" opacity="0.60"/>
  <path d="M172,210 C218,248 228,308 198,318 C180,292 172,248 170,210 Z" fill="#0d3828" opacity="0.60"/>
  <path d="M130,220 C96,254 84,302" fill="none" stroke="#1a5040" stroke-width="0.6" opacity="0.44"/>
  <path d="M128,238 C90,274 80,314" fill="none" stroke="#1a5040" stroke-width="0.6" opacity="0.44"/>
  <path d="M174,220 C208,254 220,302" fill="none" stroke="#1a5040" stroke-width="0.6" opacity="0.44"/>
  <path d="M176,238 C214,274 224,314" fill="none" stroke="#1a5040" stroke-width="0.6" opacity="0.44"/>
  <!-- Middle wings (folded, face-covering) -->
  <path d="M136,166 C100,180 90,214 122,224 C134,208 138,184 138,166 Z" fill="#0d3828" opacity="0.72"/>
  <path d="M168,166 C204,180 214,214 182,224 C170,208 166,184 166,166 Z" fill="#0d3828" opacity="0.72"/>
  <!-- Upper wings (spread to fly) — dominant visual feature -->
  <path d="M134,130 C90,118 60,178 72,208 C84,192 114,168 134,176 Z" fill="#1a5040" opacity="0.82"/>
  <path d="M170,130 C214,118 244,178 232,208 C220,192 190,168 170,176 Z" fill="#1a5040" opacity="0.82"/>
  <!-- Upper wing leading-edge highlights -->
  <path d="M134,130 C88,116 58,176 72,208"
        fill="none" stroke="#2a7055" stroke-width="1.0" opacity="0.55"/>
  <path d="M170,130 C216,116 246,176 232,208"
        fill="none" stroke="#2a7055" stroke-width="1.0" opacity="0.55"/>
  <path d="M134,164 C100,148 70,184" fill="none" stroke="#1a5040" stroke-width="0.7" opacity="0.40"/>
  <path d="M130,170 C92,158 68,196" fill="none" stroke="#1a5040" stroke-width="0.7" opacity="0.40"/>
  <path d="M128,174 C90,170 72,206" fill="none" stroke="#1a5040" stroke-width="0.7" opacity="0.40"/>
  <path d="M170,164 C204,148 234,184" fill="none" stroke="#1a5040" stroke-width="0.7" opacity="0.40"/>
  <path d="M174,170 C212,158 236,196" fill="none" stroke="#1a5040" stroke-width="0.7" opacity="0.40"/>
  <path d="M176,174 C214,170 232,206" fill="none" stroke="#1a5040" stroke-width="0.7" opacity="0.40"/>

  <!-- Azrael — Angel of Death; divine executor, not destroyer (Exodus 12:23) -->
  <!-- Robe — tall, teal-black angelic form spanning almost full card height -->
  <path d="M134,128 Q124,219 120,297
           L188,297 Q182,219 174,128 Z"
        fill="#0a2818" opacity="0.88"/>
  <!-- Robe mid-teal highlight (catches Tiphareth light from above) -->
  <path d="M142,138 Q138,188 152,228
           Q166,188 162,138 Z"
        fill="#1a5a3a" opacity="0.24"/>
  <!-- Head — veiled; the angel's face is hidden (middle wings cover; only obedience visible) -->
  <ellipse cx="152" cy="126" rx="12" ry="14" fill="#1a5a3a" opacity="0.70"/>
  <!-- Scorpio ♏ on robe — astrological attribution of path 24 -->
  <text x="152" y="194"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,Georgia,serif"
        font-size="14" fill="#2a7a5a" opacity="0.58">♏</text>

  <!-- Phoenix crown — Scorpio's third form; death-into-rebirth, Nun ascending to Tiphareth -->
  <circle cx="150" cy="104" r="28" fill="#dd8822" opacity="0.08" filter="url(#softglow)"/>
  <circle cx="150" cy="104" r="18" fill="#dd8822" opacity="0.10" filter="url(#softglow)"/>
  <circle cx="150" cy="104" r="10" fill="#dd8822" opacity="0.18"/>
  <polygon points="150,88 152.68,97.53 161.31,92.69 156.47,101.32 166,104 156.47,106.68 161.31,115.31 152.68,110.47 150,120 147.32,110.47 138.69,115.31 143.53,106.68 134,104 143.53,101.32 138.69,92.69 147.32,97.53"
           fill="#dd8822" opacity="0.55" filter="url(#glow)"/>
  <circle cx="150" cy="104" r="5" fill="#dd8822" opacity="0.85"/>

  <!-- Passover doorpost — Exodus 12:22-23; the blood on lintel and post marks the saved -->
  <!-- Stone lintel -->
  <rect x="22" y="256" width="32" height="20"
        fill="#141820" stroke="#0c1016" stroke-width="0.5"/>
  <!-- Blood mark — tau-cross form (the primal apotropaic cross pre-dating Calvary) -->
  <line x1="28" y1="261" x2="48" y2="261"
        stroke="#8a6020" stroke-width="2.5" opacity="0.76" stroke-linecap="round"/>
  <line x1="38" y1="258" x2="38" y2="274"
        stroke="#8a6020" stroke-width="2.5" opacity="0.76" stroke-linecap="round"/>
  <!-- Stone left post -->
  <rect x="22" y="276" width="32" height="69"
        fill="#141820" stroke="#0c1016" stroke-width="0.5"/>
  <!-- Stone crack lines -->
  <line x1="30" y1="292" x2="44" y2="304"
        stroke="#0c1016" stroke-width="0.6" opacity="0.70"/>
  <line x1="36" y1="322" x2="28"  y2="338"
        stroke="#0c1016" stroke-width="0.5" opacity="0.60"/>
  <!-- Two carved Ichthys on post — Apostolic mark of believers (pre-Constantine) -->
  <ellipse cx="36.5" cy="298" rx="8.5" ry="5.5"
              fill="none" stroke="#3aaa7a" stroke-width="0.8" opacity="0.46"/>
           <path d="M42.5,294.7 L48,298 L42.5,301.3"
                fill="none" stroke="#3aaa7a" stroke-width="0.8" opacity="0.46"/>
  <ellipse cx="36.65" cy="326" rx="7.65" ry="5"
              fill="none" stroke="#3aaa7a" stroke-width="0.8" opacity="0.4"/>
           <path d="M42.05,323 L47,326 L42.05,329"
                fill="none" stroke="#3aaa7a" stroke-width="0.8" opacity="0.4"/>
  <!-- Green shoot at doorpost base — grain of card XII now germinated (Jn 12:24) -->
  <ellipse cx="44" cy="341" rx="4" ry="8" fill="#2a7030" opacity="0.72"
           transform="rotate(-20, 44, 341)"/>
  <line x1="44" y1="335" x2="49" y2="325"
        stroke="#2a7030" stroke-width="1.0" opacity="0.60"/>

  <!-- Scorpion — Scorpio's first form; venom, danger, the stinging death that initiates -->
  <ellipse cx="210" cy="310"     rx="9"  ry="6"  fill="#1a5a3a" opacity="0.75"/>
  <ellipse cx="210" cy="302" rx="6"  ry="5"  fill="#1a5a3a" opacity="0.70"/>
  <!-- Chelae (claws) -->
  <path d="M201,310 L192,305 L188,308 M192,305 L190,300"
        fill="none" stroke="#3aaa7a" stroke-width="1.0" opacity="0.65"/>
  <path d="M219,310 L228,305 L232,308 M228,305 L230,300"
        fill="none" stroke="#3aaa7a" stroke-width="1.0" opacity="0.65"/>
  <!-- Walking legs (3 pairs) -->
  <line x1="205" y1="312" x2="196" y2="319"  stroke="#3aaa7a" stroke-width="0.7" opacity="0.55"/>
  <line x1="208" y1="313" x2="200" y2="322" stroke="#3aaa7a" stroke-width="0.7" opacity="0.55"/>
  <line x1="212" y1="313" x2="220" y2="322" stroke="#3aaa7a" stroke-width="0.7" opacity="0.55"/>
  <line x1="215" y1="312" x2="224" y2="319"  stroke="#3aaa7a" stroke-width="0.7" opacity="0.55"/>
  <line x1="209" y1="314" x2="205"  y2="323" stroke="#3aaa7a" stroke-width="0.7" opacity="0.55"/>
  <line x1="211" y1="314" x2="215"  y2="323" stroke="#3aaa7a" stroke-width="0.7" opacity="0.55"/>
  <!-- Curved tail with venom stinger -->
  <path d="M210,315 Q228,332 228,318 Q232,308 230,300"
        fill="none" stroke="#3aaa7a" stroke-width="1.2" opacity="0.65"/>
  <circle cx="230" cy="299" r="1.5" fill="#8a6020" opacity="0.80"/>

  <!-- Three Ichthys in the Abyss — Peter, James, John -->
  <!-- The three Transfiguration/Gethsemane witnesses; the 153 fish of Jn 21:11 -->
  <ellipse cx="80.8" cy="321" rx="6.8" ry="4.5"
              fill="none" stroke="#3aaa7a" stroke-width="0.8" opacity="0.52"/>
           <path d="M85.6,318.3 L90,321 L85.6,323.7"
                fill="none" stroke="#3aaa7a" stroke-width="0.8" opacity="0.52"/>
  <ellipse cx="116.95" cy="327" rx="5.95" ry="4"
              fill="none" stroke="#3aaa7a" stroke-width="0.8" opacity="0.46"/>
           <path d="M121.15,324.6 L125,327 L121.15,329.4"
                fill="none" stroke="#3aaa7a" stroke-width="0.8" opacity="0.46"/>
  <ellipse cx="152.88" cy="322" rx="6.38" ry="4.25"
              fill="none" stroke="#3aaa7a" stroke-width="0.8" opacity="0.49"/>
           <path d="M157.38,319.45 L161.5,322 L157.38,324.55"
                fill="none" stroke="#3aaa7a" stroke-width="0.8" opacity="0.49"/>

  <!-- Sword — divine instrument of path 24; the cutting word that separates, not destroys -->
  <!-- Blade glow -->
  <line x1="174" y1="144" x2="200" y2="289"
        stroke="#d0d8dc" stroke-width="6" opacity="0.08" filter="url(#softglow)"/>
  <!-- Blade -->
  <line x1="174" y1="144" x2="200" y2="289"
        stroke="#d0d8dc" stroke-width="1.8" opacity="0.84" stroke-linecap="round"/>
  <!-- Fuller (central groove) -->
  <line x1="173.5" y1="148" x2="199.5" y2="283"
        stroke="#0a2818" stroke-width="0.5" opacity="0.42"/>
  <!-- Edge highlight -->
  <line x1="175" y1="144" x2="201" y2="289"
        stroke="white" stroke-width="0.5" opacity="0.28"/>
  <!-- Crossguard — perpendicular to blade -->
  <line x1="175" y1="199.5" x2="195" y2="205.5"
        stroke="#d0d8dc" stroke-width="2.2" opacity="0.74" stroke-linecap="round"/>
  <!-- Grip -->
  <line x1="191" y1="204.5" x2="199" y2="210.5"
        stroke="#2a7a5a" stroke-width="3.5" opacity="0.66" stroke-linecap="round"/>
  <!-- Pommel -->
  <circle cx="201" cy="212.5" r="3.5"
          fill="#2a7a5a" opacity="0.72"/>
  <!-- Bitter drop at tip — divine justice measured to the drop; not wrath but necessity -->
  <circle cx="201" cy="293" r="3.8"
          fill="#080610" opacity="0.90"/>
  <circle cx="201" cy="293" r="2.0"
          fill="#8a6020" opacity="0.45"/>

  <!-- Card title -->
  <text x="150" y="374"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="17" fill="#88ddbb" letter-spacing="2.5"
        filter="url(#glow)">DEATH</text>

  <!-- Hebrew name / path -->
  <text x="150" y="396"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"
        font-size="9" fill="#2a5a3a" letter-spacing="3" opacity="0.75">Nun · Fish · Path 24</text>
</svg>